<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${screening.movieTitle} + ' — AbsoluteSvinema')}">
    <meta charset="UTF-8">
    <title th:text="${screening.movieTitle}"></title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main>
    <div class="container">
        <div style="display: flex; gap: 12px; margin-bottom: 24px; align-items: center;">
            <a th:href="@{/}" class="btn btn-secondary btn-sm">Home</a>
            <span style="color: var(--text-dim);">/</span>
            <a th:href="@{/screenings}" class="btn btn-secondary btn-sm">All screenings</a>
        </div>

        <div th:if="${message}" th:text="${message}" role="status" class="alert alert-success"></div>
        <div th:if="${error}" th:text="${error}" role="alert" class="alert alert-danger"></div>

        <div class="glass-panel screening-detail-hero">
            <div class="detail-header-card">
                <div>
                    <div th:switch="${screening.hall}" style="margin-bottom: 12px;">
                        <span th:case="'IMAX'" class="badge badge-imax">IMAX Experience</span>
                        <span th:case="'VIP'" class="badge badge-vip">VIP Hall</span>
                        <span th:case="*" class="badge badge-standard" th:text="${screening.hall}">Standard Hall</span>
                    </div>

                    <h1 class="page-title" th:text="${screening.movieTitle}"></h1>

                    <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 20px;"
                       th:text="${screening.movieDescription ?: 'No synopsis available for this movie.'}"></p>

                    <div class="detail-chips">
                        <div class="detail-chip">
                            <span>⏱️</span> Duration: <strong th:text="${screening.movieDurationMinutes}"></strong> min
                        </div>
                        <div class="detail-chip">
                            <span>📅</span> Starts at: <strong th:text="${#temporals.format(screening.startsAt, 'dd.MM.yyyy HH:mm')}"></strong>
                        </div>
                        <div class="detail-chip">
                            <span>🏛️</span> Hall: <strong th:text="${screening.hall}"></strong>
                        </div>
                        <div class="detail-chip">
                            <span>💰</span> Ticket price: <strong th:text="${screening.ticketPrice}"></strong> UAH
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section class="glass-panel cinema-hall-container">
            <h2 style="font-size: 1.6rem; font-weight: 800; text-align: center; margin-bottom: 10px;">
                Seats Selection
            </h2>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.95rem; margin-bottom: 30px;">
                Choose an available seat and enter your customer name to complete the reservation.
            </p>

            <div class="cinema-screen-wrap">
                <div class="cinema-screen"></div>
                <div class="cinema-screen-text">Cinema Screen</div>
            </div>

            <div class="seating-legend">
                <div class="legend-item">
                    <span class="legend-swatch available"></span>
                    <span>Available</span>
                </div>
                <div class="legend-item">
                    <span class="legend-swatch booked"></span>
                    <span>Booked</span>
                </div>
            </div>

            <div class="seat-grid-table">
                <div class="seat-row" style="flex-wrap: wrap;">
                    <div th:each="seat : ${seats}"
                         th:class="${'seat-card ' + (bookedSeatIds.contains(seat.id) ? 'seat-state-booked' : 'seat-state-available')}">
                        <div class="seat-num">
                            Row <span th:text="${seat.rowNumber}"></span>, seat <span th:text="${seat.seatNumber}"></span>
                        </div>

                        <span th:switch="${bookedSeatIds.contains(seat.id)}">
                            <span th:case="true" class="status-tag status-booked">Booked</span>
                            <span th:case="false" class="status-tag status-available">Available</span>
                        </span>

                        <form th:unless="${bookedSeatIds.contains(seat.id)}"
                              th:action="@{/screenings/{id}/book(id=${screening.id})}" method="post"
                              class="seat-inline-form">
                            <input type="hidden" name="seatId" th:value="${seat.id}">
                            <label style="font-size: 0.72rem; color: var(--text-dim); text-align: left; display: block;">
                                Customer name
                                <input type="text" name="customerName" placeholder="Your name" required autocomplete="off">
                            </label>
                            <button type="submit" class="btn btn-primary btn-sm" style="width: 100%; padding: 5px 8px; font-size: 0.75rem;">
                                Book seat
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
