<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${screening.movieTitle}"></title></head>
<body>
<a th:href="@{/}">Home</a>
<a th:href="@{/screenings}">All screenings</a>
<h1 th:text="${screening.movieTitle}"></h1>
<p th:text="${screening.movieDescription}"></p>
<p>Duration: <span th:text="${screening.movieDurationMinutes}"></span> min</p>
<p>Starts at: <span th:text="${#temporals.format(screening.startsAt, 'dd.MM.yyyy HH:mm')}"></span></p>
<p>Hall: <span th:text="${screening.hall}"></span></p>
<p>Ticket price: <span th:text="${screening.ticketPrice}"></span> UAH</p>
<p th:if="${message}" th:text="${message}" role="status"></p>
<p th:if="${error}" th:text="${error}" role="alert"></p>
<h2>Seats</h2>
<ul>
    <li th:each="seat : ${seats}">
        Row <span th:text="${seat.rowNumber}"></span>, seat <span th:text="${seat.seatNumber}"></span>
        <span th:text="${bookedSeatIds.contains(seat.id) ? 'Booked' : 'Available'}"></span>
        <form th:if="${!bookedSeatIds.contains(seat.id)}"
              th:action="@{/screenings/{id}/book(id=${screening.id})}" method="post">
            <input type="hidden" name="seatId" th:value="${seat.id}">
            <label>Customer name <input type="text" name="customerName" required></label>
            <button type="submit">Book seat</button>
        </form>
    </li>
</ul>
</body>
</html>
