<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${screening.movieTitle}"></title></head>
<body>
<a th:href="@{/screenings}">Усі сеанси</a>
<h1 th:text="${screening.movieTitle}"></h1>
<p th:text="${screening.movieDescription}"></p>
<p>Тривалість: <span th:text="${screening.movieDurationMinutes}"></span> хв</p>
<p>Початок: <span th:text="${#temporals.format(screening.startsAt, 'dd.MM.yyyy HH:mm')}"></span></p>
<p>Зал: <span th:text="${screening.hall}"></span></p>
<p>Ціна: <span th:text="${screening.ticketPrice}"></span> грн</p>
<p th:if="${message}" th:text="${message}" role="status"></p>
<p th:if="${error}" th:text="${error}" role="alert"></p>
<h2>Місця</h2>
<ul>
    <li th:each="seat : ${seats}">
        Ряд <span th:text="${seat.rowNumber}"></span>, місце <span th:text="${seat.seatNumber}"></span>
        <span th:text="${bookedSeatIds.contains(seat.id) ? 'Зайняте' : 'Вільне'}"></span>
        <form th:if="${!bookedSeatIds.contains(seat.id)}"
              th:action="@{/screenings/{id}/book(id=${screening.id})}" method="post">
            <input type="hidden" name="seatId" th:value="${seat.id}">
            <label>Ім’я покупця <input type="text" name="customerName" required></label>
            <button type="submit">Забронювати</button>
        </form>
    </li>
</ul>
</body>
</html>
