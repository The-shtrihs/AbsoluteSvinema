<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>AbsoluteSvinema — Screenings</title></head>
<body>
<a th:href="@{/}">Home</a>
<h1>Screenings</h1>
<p th:if="${screenings.isEmpty()}">No screenings are available yet.</p>
<ul>
    <li th:each="screening : ${screenings}">
        <a th:href="@{/screenings/{id}(id=${screening.id})}" th:text="${screening.movieTitle}"></a>
        <span th:text="${#temporals.format(screening.startsAt, 'dd.MM.yyyy HH:mm')}"></span>,
        <span th:text="${screening.hall}"></span>,
        <span th:text="${screening.ticketPrice}"></span> UAH,
        <span th:text="${screening.movieDurationMinutes}"></span> min
    </li>
</ul>
</body>
</html>
