<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Admin Tickets — AbsoluteSvinema')}">
    <meta charset="UTF-8">
    <title>Admin Tickets</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main>
    <div class="container">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;">
            <div>
                <a th:href="@{/admin/screenings}" class="btn btn-secondary btn-sm" style="margin-bottom: 12px;">← Admin Screenings</a>
                <h1 class="page-title">Tickets Management</h1>
                <p class="page-subtitle">View all booked tickets across all screenings, modify customer names, or cancel bookings.</p>
            </div>
            <a th:href="@{/screenings}" class="btn btn-primary">Book New Seat +</a>
        </div>

        <div th:if="${message}" th:text="${message}" role="status" class="alert alert-success"></div>
        <div th:if="${error}" th:text="${error}" role="alert" class="alert alert-danger"></div>

        <div th:if="${tickets.isEmpty()}" class="glass-panel" style="text-align: center; padding: 48px;">
            <p style="color: var(--text-muted); font-size: 1.1rem;">No tickets booked in the system yet.</p>
        </div>

        <div th:unless="${tickets.isEmpty()}" class="glass-panel" style="padding: 0; overflow: hidden;">
            <div class="data-table-wrap">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Customer Name</th>
                        <th>Movie Title</th>
                        <th>Hall</th>
                        <th>Seat</th>
                        <th>Booked At</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="td : ${tickets}">
                        <td><code style="color: var(--accent-cyan);" th:text="${'#' + td.ticket.id}"></code></td>
                        <td>
                            <strong th:text="${td.ticket.customerName ?: 'Anonymous Guest'}"></strong>
                        </td>
                        <td>
                            <a th:href="@{/screenings/{id}(id=${td.screening.id})}" style="color: var(--text-main); text-decoration: none;"
                               th:text="${td.screening.movieTitle}"></a>
                        </td>
                        <td>
                            <span class="badge badge-standard" th:text="${td.screening.hall}"></span>
                        </td>
                        <td>
                            <span style="color: var(--accent-emerald); font-weight: 600;">
                                Row <span th:text="${td.seat.rowNumber}"></span>, Seat <span th:text="${td.seat.seatNumber}"></span>
                            </span>
                        </td>
                        <td th:text="${#temporals.format(td.ticket.bookedAt, 'dd.MM.yyyy HH:mm')}"></td>
                        <td>
                            <div class="table-actions">
                                <a th:href="@{/admin/tickets/{id}/edit(id=${td.ticket.id})}" class="btn btn-secondary btn-sm">
                                    Rename
                                </a>
                                <form th:action="@{/admin/tickets/{id}/cancel(id=${td.ticket.id})}" method="post" style="display: inline; margin: 0;">
                                    <button type="submit" class="btn btn-danger btn-sm"
                                            onclick="return confirm('Are you sure you want to cancel this ticket? The seat will immediately become available.');">
                                        Cancel
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
