<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Create Account — AbsoluteSvinema')}">
    <meta charset="UTF-8">
    <title>Create Account</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main>
    <div class="container" style="max-width: 480px; margin-top: 20px;">
        <div class="glass-panel" style="padding: 40px 32px;">
            <div style="text-align: center; margin-bottom: 28px;">
                <span class="brand-icon" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 1.4rem;">✨</span>
                <h1 style="font-size: 1.8rem; font-weight: 800;">Create Account</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Join AbsoluteSvinema to book and manage tickets</p>
            </div>

            <div th:if="${error}" th:text="${error}" role="alert" class="alert alert-danger"></div>

            <form th:action="@{/register}" th:object="${registerForm}" method="post">
                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Danylo Marchenko" required>
                    <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="danylo@svinema.ua" required>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password (min 6 characters)</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
                    Register Now
                </button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account?
                <a th:href="@{/login}" style="color: var(--accent-cyan); text-decoration: none; font-weight: 600;">Sign in here</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
