spring.application.name=AbsoluteSvinema

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:absolutesvinema}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always

spring.data.jpa.repositories.enabled=false
# Keep domain exceptions from repository implementations unchanged. Spring Data
# repositories still translate persistence failures at their own proxy boundary.
spring.persistence.exceptiontranslation.enabled=false

app.security.password-salt=${PASSWORD_SALT:}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=ua.kpi.absolutesvinema.controller.api
springdoc.paths-to-match=/api/**
