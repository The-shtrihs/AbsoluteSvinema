spring.application.name=AbsoluteSvinema

# Local runs read ./.env (KEY=value is valid .properties syntax).
# In Docker the same keys arrive as real environment variables via env_file.
spring.config.import=optional:file:./.env[.properties]

# DB_HOST defaults to localhost for host runs; compose sets DB_HOST=db for the app container.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:absolutesvinema}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=ua.kpi.absolutesvinema.controller.api
springdoc.paths-to-match=/api/**
