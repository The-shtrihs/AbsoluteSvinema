# Tests run without Docker: an in-memory H2 database in PostgreSQL mode.
# classpath:/config/application.properties overrides only these keys of the main file.
# A random name gives every cached Spring test context its own isolated database.
spring.datasource.url=jdbc:h2:mem:svinema-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Fake test-only pepper; real value lives only in the local .env.
app.security.password-salt=test-only-password-pepper
