# Tests run without Docker: an in-memory H2 database in PostgreSQL mode.
# classpath:/config/application.properties overrides only these keys of the main file.
spring.datasource.url=jdbc:h2:mem:svinema;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
